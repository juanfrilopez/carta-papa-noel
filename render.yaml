services:
  - type: web
    name: carta-papa-noel
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: GEMINI_TTS_VOICE
        value: Charon
